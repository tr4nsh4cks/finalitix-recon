server {
    listen 8080 default_server;
    server_name _;
    root /storage;

    # Link viejo sigue funcionando
    location = /INSTRUCCIONES_GEMELO.md {
        return 302 /compartido/INSTRUCCIONES_GEMELO.md;
    }

    # Solo estas tres carpetas se sirven; todo lo demas 404 (mcp, etc.)
    location ~ ^/(pentagi|pentagi_gemelo|compartido)(/|$) {
        autoindex on;
        auth_basic "hexagon";
        auth_basic_user_file /etc/nginx/.mcp_htpasswd;
    }

    location / {
        return 404;
    }
}
