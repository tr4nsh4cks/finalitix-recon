# MONGO
lyde.connector.mongo-user=${USERVAR_LYDE_MONGODB_USER}
lyde.connector.mongo-host=${USERVAR_LYDE_MONGODB_HOST}
lyde.connector.mongo-pass=${USERVAR_LYDE_MONGODB_PASS}
lyde.connector.mongo-db=${USERVAR_LYDE_MONGODB_DB}
lyde.connector.mongo-auth=${USERVAR_LYDE_MONGODB_AUTH}
# Lyde
lyde.baseUri=${USERVAR_LYDE_BASEURI}
lyde.timeout=${USERVAR_LYDE_TIMEOUT}
lyde.token.path=${USERVAR_LYDE_TOKEN_PATH}
lyde.token.clientId=${USERVAR_LYDE_TOKEN_CLIENTID}
lyde.token.clientSecret=${USERVAR_LYDE_TOKEN_CLIENTSECRET}
lyde.token.grantType=${USERVAR_LYDE_TOKEN_GRANTTYPE}
lyde.token.authenticatedUserid=${USERVAR_LYDE_TOKEN_AUTHENTICATEDUSERID}
lyde.token.scope=${USERVAR_LYDE_TOKEN_SCOPE}
lyde.inventory.path=${USERVAR_LYDE_INVENTORY_PATH}

#disabled job run at startup
#spring.batch.job.enabled=false

#spring.jpa.show-sql = true

# Custom body with actuator/info
info.app.name=@project.name@
info.app.description=@project.description@
info.app.groupId = @project.groupId@
info.app.artifactId = @project.artifactId@
info.app.version = @project.version@
info.app.dev-version=1.0.0

# Health
# By configuration to Kubernetes the base-path is only: /
management.endpoints.web.base-path=/actuator
# By configuration to Kubernetes the endpoint healthz is only: /healthz
management.endpoints.web.path-mapping.health=healthz
#management.endpoints.web.path-mapping.info=/rotterdam/v1/lyde/actuator/info
#management.endpoints.web.exposure.include=health,info
management.endpoint.shutdown.enabled=false
management.info.env.enabled=true
management.endpoint.health.show-details=always

schedule_cron=${USERVAR_LYDE_EXECUTION_SCHEDULE}
#spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# WhiteList stores
lyde.stores.whiteList=${USERVAR_LYDE_STORES_WHITELIST}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration