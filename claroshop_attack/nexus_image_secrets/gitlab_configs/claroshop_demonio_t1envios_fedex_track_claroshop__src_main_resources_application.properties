logging.level.org.hibernate.SQL=debug
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

#server.port = 8005
#spring.profiles.active=http_connection
#comment above profile and uncoment line below to operate using https
spring.profiles.active=https_connection
spring.main.allow-bean-definition-overriding=true

# Configuraci�n del pool de conexiones HikariCP
# Tiempo m�ximo para establecer una conexi�n (en milisegundos)
spring.datasource.hikari.connectionTimeout=30000
# Tiempo de inactividad antes de cerrar conexiones inactivas (en milisegundos)
spring.datasource.hikari.idleTimeout=60000
# Tiempo m�ximo de vida de una conexi�n (en milisegundos)
spring.datasource.hikari.maxLifetime=180000
# Cantidad m�nima de conexiones inactivas en el pool
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.maximumPoolSize=50

# Consulta de prueba para validar las conexiones antes de usarlas
spring.datasource.hikari.connectionTestQuery=SELECT 1

