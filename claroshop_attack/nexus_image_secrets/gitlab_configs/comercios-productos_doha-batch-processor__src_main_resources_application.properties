quarkus.mongodb.connection-string=${USERVAR_MONGODB_CONEXION}
quarkus.mongodb.database=${USERVAR_MONGODB_DATABASE}
quarkus.mongodb.credentials.username=${USERVAR_MONGODB_USER}
quarkus.mongodb.credentials.password=${USERVAR_MONGODB_PASS}
quarkus.mongodb.credentials.auth-source=${USERVAR_MONGODB_AUTH}

quarkus.log.handler.gelf.enabled=true
quarkus.log.handler.gelf.host=${USERVAR_CONFIG_APP_QUARKUS_LOG_HANDLER_GELF_HOST}
quarkus.log.handler.gelf.port=${USERVAR_CONFIG_APP_QUARKUS_LOG_HANDLER_GELF_PORT}
quarkus.log.handler.gelf.additional-field."originHost".value=viena-batch-processor

quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG
quarkus.log.handler.gelf.level=${USERVAR_CONFIG_APP_QUARKUS_LOG_APP}

quarkus.health.extensions.enabled=true
quarkus.smallrye-health.root-path=/healthz

version.app=1.1.14
