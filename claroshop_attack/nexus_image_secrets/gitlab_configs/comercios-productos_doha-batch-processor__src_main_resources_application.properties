quarkus.http.port=8080


#Kafka
kafka.bootstrap.servers=${USERVAR_KAFKA_BOOTSTRAP_SERVERS}
mp.messaging.incoming.ticket.connector=smallrye-kafka
mp.messaging.incoming.ticket.topic=${USERVAR_INCOMING_PRODUCT_TOPIC}
mp.messaging.incoming.ticket.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.ticket.commit-strategy=latest
mp.messaging.incoming.ticket.auto.offset.reset=earliest
mp.messaging.incoming.ticket.failure-strategy=dead-letter-queue
mp.messaging.incoming.ticket.dead-letter-queue.topic=${USERVAR_DEAD_LETTER_QUEUE_TOPIC}
mp.messaging.incoming.ticket.group.id=${USERVAR_KAFKA_GROUP_ID}

mp.messaging.incoming.ticket.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${USERVAR_KAFKA_USERNAME}" password="${USERVAR_KAFKA_PASSWORD}";
mp.messaging.incoming.ticket.security.protocol=SASL_SSL
mp.messaging.incoming.ticket.sasl.mechanism=${USERVAR_SASL_MECHANISM}
mp.messaging.incoming.ticket.ssl.truststore.location=${USERVAR_TRUSTSTORE_LOCATION}
mp.messaging.incoming.ticket.ssl.truststore.password=${USERVAR_TRUSTSTORE_PASSWORD}

